[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen38-ternary"
version = "0.1.0"
description = "Activation-aware ternary / mixed-bit compression pipeline for Qwen3.8-27B on a 16 GB workstation GPU."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "qwen38-ternary contributors" }]
dependencies = [
    "accelerate",
    "datasets",
    "einops",
    "gguf",
    "huggingface_hub",
    "lm-eval",
    "numpy",
    "pandas",
    "psutil",
    "pyyaml",
    "rich",
    "safetensors",
    "scipy",
    "sentencepiece",
    "transformers>=5.8",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/q38ternary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
