project:
  name: qwen38-ternary
  seed: 42
  # Clean research implementation inspired by the public Prism
  # representation/runtime. Not PrismML's proprietary training recipe.
  inspiration: prism-public-runtime

model:
  repo: Qwen/Qwen3.8-27B
  text_only: true
  include_vision: false
  include_mtp: false
  local_dir: models/source/Qwen3.8-27B

hardware:
  gpu_memory_limit_gb: 14.0
  system_memory_limit_gb: 52.0
  minimum_free_disk_gb: 180
  preferred_free_disk_gb: 250

quantization:
  primary_scheme: ternary
  alphabet: [-1, 0, 1]
  group_size: 128
  scale_dtype: float16

reconstruction:
  pilot_layers: [0, 3, 15, 31, 47, 63]
  sequence_length: 1024
  initial_steps: 150
  progressive: true
  automatic_oom_recovery: true

calibration:
  pilot_sequences: 512
  pilot_length: 1024
  standard_sequences: 2048
  standard_length: 2048

output:
  initial_target_gb: 8.5
  full_ternary_target_gb: 7.5
